<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icp-scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">

  <div class="shell">

    <section class="results" id="results" aria-live="polite"></section>

    <section class="panel" id="panel" aria-hidden="true">
      <header class="panel-head">
        <button class="back" id="back" type="button" aria-label="Zpět" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="panel-title" id="panel-title">Filtry</span>
        <span class="panel-count" id="panel-count"></span>
      </header>

      <div class="panel-body" id="panel-body"></div>

      <footer class="panel-foot" id="panel-foot">
        <button class="cancel" id="cancel" type="button">Zrušit</button>
        <span class="discard" id="discard"></span>
        <button class="save" id="save" type="button">Uložit</button>
      </footer>
    </section>

    <div class="bar">
      <button class="gear" id="gear" type="button" aria-label="Filtry" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 6.5h5M12 6.5h5M3 13.5h9M16 13.5h1"/>
          <circle cx="10" cy="6.5" r="1.9"/>
          <circle cx="14" cy="13.5" r="1.9"/>
        </svg>
      </button>
      <input class="query" id="query" type="text" placeholder="" autocomplete="off">
      <button class="run" id="run" type="button" aria-label="Spustit">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
      </button>
    </div>

    <p class="summary" id="summary"></p>

  </div>

</main>

<section class="evidence-modal" id="evidence-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="evidence-title">
  <div class="evidence-backdrop" data-close-evidence></div>
  <div class="evidence-dialog">
    <header class="evidence-head">
      <div>
        <span class="evidence-kicker">Доказательство</span>
        <h2 id="evidence-title">Архивированная страница</h2>
      </div>
      <button class="evidence-close" type="button" aria-label="Закрыть" data-close-evidence>×</button>
    </header>
    <p class="evidence-meta" id="evidence-meta"></p>
    <blockquote class="evidence-quote" id="evidence-quote"></blockquote>
    <div class="evidence-actions">
      <a id="evidence-full" class="evidence-full" href="#" target="_blank" rel="noreferrer">Открыть полный текст</a>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
