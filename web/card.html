<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icp-scout — podklady týdne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="card.css">
</head>
<body class="cards-body">

<header class="cards-head">
  <div>
    <h1 class="cards-title">Podklady týdne</h1>
    <p class="cards-sub" id="summary">Načítám…</p>
  </div>
  <div class="legend">
    <span><i class="dot dot-fact"></i>fakt — citace nalezena ve zdroji</span>
    <span><i class="dot dot-inf"></i>úsudek — bez citace</span>
    <span><i class="dot dot-none"></i>prázdné — nezjištěno</span>
  </div>
</header>

<main id="cards" class="cards"></main>

<footer class="cards-foot">
  <button id="more" class="more" hidden>Další firmy</button>
</footer>

<script src="card.js"></script>
</body>
</html>
